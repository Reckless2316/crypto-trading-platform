# Autonomous paper runtime CI: locked install, full unittest suite, outbound network blocked.
# Never deploys, publishes images, or contacts a venue/provider. Live trading is not reachable from CI.
name: autonomous

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # CI-only guard (deploy/autonomous/ci/sitecustomize.py): non-loopback connect/DNS raises and is logged.
      SURGE_BLOCK_NETWORK: "1"
      SURGE_NETWORK_VIOLATIONS_LOG: ${{ github.workspace }}/network-violations.jsonl
      PYTHONDONTWRITEBYTECODE: "1"
      # Belt and braces: no live switch is ever on in CI.
      SURGE_LIVE_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-autonomous.lock

      - name: Install exact lock (network allowed only for this step)
        env:
          SURGE_BLOCK_NETWORK: "0"
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --no-deps -r requirements-autonomous.lock
          python -m pip check

      - name: Inert parser checks (no keys, no venue)
        env:
          PYTHONPATH: deploy/autonomous/ci
        run: |
          python -c "import sitecustomize, socket; assert socket.getaddrinfo.__module__ == 'sitecustomize', 'network guard not active'"
          python -m bot.autonomous.runtime --help > /dev/null

      - name: Unit tests (outbound network blocked)
        env:
          PYTHONPATH: deploy/autonomous/ci
        run: python -m unittest discover -s tests

      - name: Fail on any attempted network call
        if: always()
        run: |
          if [ -s "$SURGE_NETWORK_VIOLATIONS_LOG" ]; then
            echo "::error::Tests attempted outbound network calls (see log below). Inject a fake source instead."
            cat "$SURGE_NETWORK_VIOLATIONS_LOG"
            exit 1
          fi
          echo "No outbound network attempts."

      - name: Upload network violation log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: network-violations
          path: network-violations.jsonl
          if-no-files-found: ignore
